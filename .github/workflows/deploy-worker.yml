# Cloudflare Worker (aio-pos-verify) — cloudflare-worker/ فولڈر main میں بدلے تو خود Deploy
# ضروری GitHub Secrets (ایک بار): CLOUDFLARE_API_TOKEN اور CLOUDFLARE_ACCOUNT_ID
name: Deploy Cloudflare Worker (aio-pos-verify)

on:
  push:
    branches: [main]
    paths: ['cloudflare-worker/**']
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Secrets not set yet — skip
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID GitHub Secrets میں نہیں — Deploy چھوڑ دیا"
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - name: Deploy to Cloudflare
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
      # MCS: بورڈ پڑھنے والے راستے (/ocr) کی جانچ — ناکام ہو تب بھی Deploy پر اثر نہیں
      - name: Test /ocr (board reader)
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        run: |
          sleep 8
          IMG="data:image/jpeg;base64,$(base64 -w0 cloudflare-worker/test-board.jpg)"
          printf '{"image":"%s"}' "$IMG" > /tmp/ocr.json
          curl -sS -m 90 -X POST https://aio-pos-verify.pbtcodelabs.workers.dev/ocr -H 'Content-Type: application/json' --data @/tmp/ocr.json
          echo
