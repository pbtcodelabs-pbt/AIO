# Cloudflare Worker (aio-pos-verify) — cloudflare-worker/ فولڈر main میں بدلے تو خود Deploy
# ضروری GitHub Secrets (ایک بار): CLOUDFLARE_API_TOKEN اور CLOUDFLARE_ACCOUNT_ID
name: Deploy Cloudflare Worker (aio-pos-verify)

on:
  push:
    branches: [main]
    paths: ['cloudflare-worker/**']
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Secrets not set yet — skip
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID GitHub Secrets میں نہیں — Deploy چھوڑ دیا"
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - name: Deploy to Cloudflare
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
      # MCS: بورڈ پڑھنے والے راستے (/ocr) کی جانچ — ناکام ہو تب بھی Deploy پر اثر نہیں
      - name: Test /ocr (board reader)
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        run: |
          sleep 8
          IMG="data:image/jpeg;base64,$(base64 -w0 cloudflare-worker/test-board.jpg)"
          for M in @cf/meta/llama-4-scout-17b-16e-instruct @cf/mistralai/mistral-small-3.1-24b-instruct; do
            printf '{"model":"%s","image":"%s"}' "$M" "$IMG" > /tmp/ocr.json
            curl -sS -m 90 -X POST https://aio-pos-verify.pbtcodelabs.workers.dev/ocr -H 'Content-Type: application/json' --data @/tmp/ocr.json
            echo
          done
      # MCS: ریٹ والے راستے (/rates) کی جانچ
      - name: Test /rates
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        run: |
          sleep 3
          curl -sS -m 40 https://aio-pos-verify.pbtcodelabs.workers.dev/rates; echo
          curl -sS -m 60 "https://aio-pos-verify.pbtcodelabs.workers.dev/rates?debug=1"; echo
          curl -sS -m 20 -I https://aio-pos-verify.pbtcodelabs.workers.dev/rates | grep -i "access-control" || true
          echo "== /stat"
          curl -sS -m 20 -X POST https://aio-pos-verify.pbtcodelabs.workers.dev/stat -H 'Content-Type: text/plain' -d '{"rec":"_test","kind":"call"}'; echo
          curl -sS -m 20 "https://aio-pos-verify.pbtcodelabs.workers.dev/stat?recs=_test"; echo
          curl -sS -m 20 "https://aio-pos-verify.pbtcodelabs.workers.dev/stat?mode=admin&days=7" | head -c 600; echo
